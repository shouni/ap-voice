{{ define "history.html" }}<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>履歴 | AP Voice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
{{ template "nav" . }}

<main class="container main-content" style="max-width: 46rem;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h5 mb-0">履歴</h1>
    <a class="btn btn-primary btn-sm" href="/">台本を作成</a>
  </div>

  {{ if .Jobs }}
    <div class="list-group">
      {{ range .Jobs }}
        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
           href="/history/{{ .ID }}">
          <code>{{ .ID }}</code>
          {{ if .HasAudio }}<span class="badge bg-success">音声あり</span>
          {{ else }}<span class="badge bg-secondary">台本のみ</span>{{ end }}
        </a>
      {{ end }}
    </div>
  {{ else }}
    <p class="text-secondary">まだ何もありません。<a href="/">台本を作成</a>してください。</p>
  {{ end }}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>{{ end }}
