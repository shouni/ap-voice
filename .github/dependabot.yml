# The reasons for each setting are in the Dependabot conventions section of the shouni/workflows README.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # The Dockerfile's base image. **It is built by cloudbuild.yaml, so it never shows up in CI**, but
  # unless it is tracked nobody bumps it. `FROM scratch` is out of Dependabot's scope.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
